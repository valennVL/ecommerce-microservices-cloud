<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h2>Order Details</h2>
    <a href="/orders" class="btn btn-primary mb-3">Back to Orders</a>

    <div id="order-info" class="card mb-4">
        <div class="card-body">
            <p><strong>Order ID:</strong> <span id="order-id"></span></p>
            <p><strong>User:</strong> <span id="order-user"></span></p>
            <p><strong>Email:</strong> <span id="order-email"></span></p>
            <p><strong>Total:</strong> $<span id="order-total"></span></p>
	    <p><strong>Status:</strong> <span id="order-status" class="badge badge-warning"></span></p>
            <p><strong>Date:</strong> <span id="order-date"></span></p>
        </div>
    </div>

    <div id="order-actions" class="mt-3">
	    <button
		id="confirm-order"
		class="btn btn-success mr-2"
		onclick="updateOrderStatus('confirmed')">
		Confirmar
	    </button>

	    <button
		id="cancel-order"
		class="btn btn-danger"
		onclick="updateOrderStatus('cancelled')">
		Cancelar
	    </button>
    </div>

    <h4>Products in this Order</h4>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Name</th>
                <th>Unit Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody id="order-products"></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="/static/scriptOrders.js"></script>
<script>
    const orderId = {{ id }};
    getOrderDetail(orderId);
</script>
</body>
</html>
